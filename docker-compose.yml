x-backend-environment: &backend-environment
  NODE_ENV: production
  # Production uses the private PostgreSQL container below. The database is
  # never exposed publicly and all API/worker writes go to this service.
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_USER: ${DATABASE_USER}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  DATABASE_NAME: ${DATABASE_NAME}
  DATABASE_SSL: "false"
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-0}
  DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}
  # Always apply committed, transactional migrations before a production
  # process begins serving requests. The worker starts only after the API is
  # healthy, so migrations cannot race between these services.
  DATABASE_MIGRATIONS_RUN: "true"
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
  GOOGLE_GMAIL_CALLBACK_URL: ${GOOGLE_GMAIL_CALLBACK_URL}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY}
  SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  GROQ_API_KEY: ${GROQ_API_KEY}
  EVAL_PROVIDER: ${EVAL_PROVIDER}
  TASK_PROVIDER: ${TASK_PROVIDER}
  MAILJET_API_KEY: ${MAILJET_API_KEY}
  MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY}
  MAILJET_FROM_EMAIL: ${MAILJET_FROM_EMAIL}
  MAILJET_FROM_NAME: ${MAILJET_FROM_NAME}
  FRONTEND_URL: ${FRONTEND_URL:-https://anchorapp.feeltiptop.com}
  APP_URL: ${APP_URL:-https://anchorapp.feeltiptop.com}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://anchorapp.feeltiptop.com}

services:
  postgres:
    # Set POSTGRES_IMAGE to the same major version as the Neon source.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg15}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME must be set}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER must be set}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
    volumes:
      - anchor_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - community_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: anchor-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-environment
      COMMUNITY_WORKER_ENABLED: "false"
      TASK_SCHEDULER_ENABLED: "true"
    ports:
      - "127.0.0.1:3012:3001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:3001/health/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  community-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-environment
      COMMUNITY_WORKER_ENABLED: "true"
      TASK_SCHEDULER_ENABLED: "false"
    command: ["node", "dist/worker.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://backend:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    container_name: anchor-frontend
    build:
      context: ./web-frontend/anchor-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-https://anchorapp.feeltiptop.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the public production API URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-https://anchorapp.feeltiptop.com}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the public production API URL}
    ports:
      - "127.0.0.1:3013:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  website:
    container_name: anchor-website
    build:
      context: ./web-frontend/website
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the public production API URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the public production API URL}
    ports:
      - "127.0.0.1:3014:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  anchor_data:
  pgadmin_data:
  community_redis_data:
