version: '3.9'

services:
  postgres:
    container_name: anchor-postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: anchor
      POSTGRES_DB: anchor
    ports:
      - '5432:5432'
    volumes:
      - anchor_data:/var/lib/postgresql/data

  pgadmin:
    container_name: anchor-pgadmin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  anchor_data:
