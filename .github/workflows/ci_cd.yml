name: Deploy to Remote Server - Anchor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Before Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web-frontend/website/package-lock.json
            web-frontend/anchor-web/package-lock.json

      - name: Check website
        working-directory: web-frontend/website
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/npm-ci-audit-build.sh"

      - name: Check landing frontend
        working-directory: web-frontend/anchor-web
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/npm-ci-audit-build.sh"

      - name: Check backend
        working-directory: backend
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/npm-ci-audit-build.sh"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            echo "Switching to root and executing script..."
            sudo -S bash -c '
              cd /root/docker/anchor
              chmod +x build-app.sh
              ./build-app.sh

              # Compose only applies container_name when the deployed compose
              # file sets it, so the container is either anchor-backend or
              # anchor-backend-1. Resolve it rather than assuming one form.
              # 150 attempts x 2s = 300s. The container applies pending
              # migrations before it starts serving, and its healthcheck alone
              # needs ~145s (25s start_period + 8 retries x 15s) to reach a
              # verdict, so a shorter wait reports failure before the backend
              # has had a chance to come up.
              backend_container=""
              backend_health=""
              deployment_ready=0
              for attempt in $(seq 1 150); do
                if [ -z "$backend_container" ]; then
                  backend_container=$(docker ps -a --format "{{.Names}}" | grep -E "^anchor-backend(-[0-9]+)?$" | head -n 1)
                fi
                if [ -n "$backend_container" ]; then
                  backend_health=$(docker inspect --format "{{.State.Health.Status}}" "$backend_container" 2>/dev/null || true)
                  if [ "$backend_health" = "healthy" ]; then
                    deployment_ready=1
                    break
                  fi
                fi
                sleep 2
              done

              if [ "$deployment_ready" -ne 1 ]; then
                echo "Backend did not become healthy after deployment."
                if [ -n "$backend_container" ]; then
                  echo "Container $backend_container last reported health: ${backend_health:-none}"
                  docker logs --tail 200 "$backend_container" | grep -vF ECONNREFUSED || true
                else
                  echo "No container matching anchor-backend was found. Current containers:"
                  docker ps -a --format "{{.Names}}\t{{.Status}}"
                fi
                exit 1
              fi

              echo "Backend migrations and readiness checks completed."
            ' <<< '${{ secrets.PASSWORD }}'
