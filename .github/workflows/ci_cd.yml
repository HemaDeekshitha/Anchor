name: Deploy to Remote Server - Anchor
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            echo "Switching to root and executing script..."
              sudo -S bash -c '
                cd /root/docker/anchor
                chmod +x build-app.sh
                ./build-app.sh
              ' <<< '${{secrets.PASSWORD}}'
