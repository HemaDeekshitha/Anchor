name: Deploy to Remote Server - Anchor

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Before Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web-frontend/website/package-lock.json
            web-frontend/anchor-web/package-lock.json

      - name: Check website
        working-directory: web-frontend/website
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Check landing frontend
        working-directory: web-frontend/anchor-web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Check backend
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            echo "Switching to root and executing script..."
            sudo -S bash -c '
              cd /root/docker/anchor
              chmod +x build-app.sh
              ./build-app.sh
            ' <<< '${{ secrets.PASSWORD }}'
