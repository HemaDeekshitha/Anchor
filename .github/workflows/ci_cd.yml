name: Deploy to Remote Server - Anchor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: website
            dir: web-frontend/website
            lock: web-frontend/website/package-lock.json
            test: false
          - name: landing
            dir: web-frontend/anchor-web
            lock: web-frontend/anchor-web/package-lock.json
            test: false
          - name: backend
            dir: backend
            lock: backend/package-lock.json
            test: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install and build
        working-directory: ${{ matrix.dir }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/npm-ci-audit-build.sh"

      - name: Run backend tests
        if: matrix.test
        working-directory: ${{ matrix.dir }}
        run: npm test -- --runInBand

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: validate

    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m
          script: |
            echo "Switching to root and executing script..."
            sudo -S bash -c '
              set -Eeuo pipefail
              cd /root/docker/anchor
              test -f build-app.sh
              chmod +x build-app.sh
              ./build-app.sh
              test -f .github/scripts/verify-deployment.sh
              bash .github/scripts/verify-deployment.sh
            ' <<< '${{ secrets.PASSWORD }}'
